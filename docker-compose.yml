services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: merchantops
      MYSQL_USER: merchantops
      MYSQL_PASSWORD: merchantops_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      DB_NAME: merchantops
      DB_USER: merchantops
      DB_PASSWORD: merchantops_dev
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mysql_data:
  frontend_node_modules:
