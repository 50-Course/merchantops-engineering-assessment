<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — MerchantOps</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f6f7f9;
            color: #172033;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }
        main {
            background: white;
            padding: 36px;
            width: min(360px, 85vw);
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }
        h1 { margin-top: 0; }
        label {
            display: block;
            margin: 16px 0 6px;
        }
        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccd2dc;
            border-radius: 6px;
        }
        button {
            background: #172033;
            color: white;
            border: 0;
            border-radius: 6px;
            padding: 12px;
            margin-top: 22px;
            width: 100%;
            cursor: pointer;
        }
        .error { color: #b42318; }
    </style>
</head>
<body>
    <main>
        <h1>MerchantOps</h1>
        <p>Sign in to your workspace.</p>

        {% if form.errors %}
            <p class="error">
                Invalid username or password.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="id_username">Username</label>
            <input
                id="id_username"
                name="username"
                type="text"
                autocomplete="username"
                required
            >

            <label for="id_password">Password</label>
            <input
                id="id_password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
